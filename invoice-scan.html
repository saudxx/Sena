<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>مسح الفواتير</title>
<link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;700&display=swap" rel="stylesheet">
<style>
:root{--paper:#eef0f4;--ink:#2a3a9c;--text:#1d2236;--line:#c9cedb;--ok:#1d7a4a;--card:#fff}
@media (prefers-color-scheme:dark){:root{--paper:#14172a;--ink:#8fa0ff;--text:#e8eaf5;--line:#2c3250;--card:#1c2038;--ok:#4cc58a}}
*{box-sizing:border-box}
body{margin:0;background:var(--paper);color:var(--text);font-family:Tajawal,system-ui,sans-serif;padding:env(safe-area-inset-top) 14px env(safe-area-inset-bottom)}
h1{font-size:20px;margin:16px 0 12px;color:var(--ink)}
input,button{font:inherit}
.in{width:100%;padding:14px;border:2px solid var(--ink);border-radius:8px;background:var(--card);color:var(--text);font-size:18px}
.btn{width:100%;margin-top:12px;padding:14px;border:0;border-radius:8px;background:var(--ink);color:var(--paper);font-weight:700;font-size:18px}
.btn.ghost{background:none;border:2px solid var(--ink);color:var(--ink)}
#scan{display:none}
.cam{position:relative;border-radius:10px;overflow:hidden;background:#000;aspect-ratio:4/3}
video{width:100%;height:100%;object-fit:cover}
.frame{position:absolute;inset:18% 8%;border:3px dashed #fff;border-radius:8px;opacity:.85}
.frame.hit{border-color:#4cc58a;border-style:solid}
#status{margin:10px 0;min-height:24px;font-weight:700}
table{width:100%;border-collapse:collapse;background:var(--card);border-radius:8px;overflow:hidden}
th,td{padding:8px;border-bottom:1px solid var(--line);text-align:right;font-size:15px}
th{color:var(--ink)}
td.n{direction:ltr;font-weight:700;letter-spacing:1px}
.row{display:flex;gap:8px}.row .btn{margin-bottom:16px}
</style>
</head>
<body>
<section id="start">
  <h1>اسم السواق</h1>
  <input id="driver" class="in" placeholder="اكتب اسم السواق" autocomplete="off">
  <button class="btn" id="go">ابدأ المسح</button>
</section>

<section id="scan">
  <h1 id="who"></h1>
  <div class="cam"><video id="v" playsinline muted></video><div class="frame" id="fr"></div></div>
  <div id="status">جاري تشغيل الكاميرا…</div>
  <table>
    <thead><tr><th>#</th><th>السواق</th><th>آخر 4</th><th></th></tr></thead>
    <tbody id="rows"></tbody>
  </table>
  <div class="row" style="margin-top:12px">
    <button class="btn" id="copy">نسخ الجدول</button>
    <button class="btn ghost" id="csv">تحميل CSV</button>
  </div>
  <button class="btn ghost" id="change" style="margin-bottom:20px">تغيير السواق</button>
</section>

<script src="https://cdn.jsdelivr.net/npm/tesseract.js@5.1.1/dist/tesseract.min.js"></script>
<script>
const $ = id => document.getElementById(id);
let driver = "", items = [], worker, last = "", busy = false, stream;
try { items = JSON.parse(localStorage.getItem("inv_items") || "[]"); driver = localStorage.getItem("inv_driver") || ""; } catch (e) {}
$("driver").value = driver;
const save = () => { try { localStorage.setItem("inv_items", JSON.stringify(items)); localStorage.setItem("inv_driver", driver); } catch (e) {} };

function render() {
  $("rows").innerHTML = "";
  items.forEach((it, i) => {
    const tr = document.createElement("tr");
    tr.innerHTML = `<td>${i + 1}</td><td>${it.driver}</td><td class="n">${it.last4}</td><td><button style="border:0;background:none;color:var(--ink);font-size:18px">✕</button></td>`;
    tr.querySelector("button").onclick = () => { items.splice(i, 1); save(); render(); };
    $("rows").appendChild(tr);
  });
}

// يقرأ آخر 4 أرقام من رقم الفاتورة فقط
function parse(text) {
  const lines = text.split("\n").map(s => s.trim()).filter(Boolean);
  let last4 = null;
  for (const l of lines) {
    const m = l.replace(/[\s-]/g, "").match(/(\d{10})/);
    if (m && !/^\d{4}-\d{2}-\d{2}$/.test(l)) { last4 = m[1].slice(-4); break; }
  }
  return { last4 };
}

async function loop() {
  const v = $("v"), c = document.createElement("canvas");
  while (stream) {
    if (v.videoWidth && !busy) {
      busy = true;
      const w = 1000, h = w * v.videoHeight / v.videoWidth;
      c.width = w; c.height = h;
      const ctx = c.getContext("2d");
      ctx.filter = "grayscale(1) contrast(1.4)";
      ctx.drawImage(v, 0, 0, w, h);
      try {
        const { data } = await worker.recognize(c);
        const r = parse(data.text);
        if (r.last4) {
          const key = r.last4;
          if (key === last) {
            if (!items.some(x => x.last4 === key)) {
              items.push({ driver, last4: key });
              save(); render();
              $("fr").classList.add("hit");
              $("status").textContent = `تم التقاط الفاتورة: ${key}`;
              $("status").style.color = "var(--ok)";
              if (navigator.vibrate) navigator.vibrate(120);
              setTimeout(() => $("fr").classList.remove("hit"), 900);
            }
          }
          last = key;
        } else { last = ""; $("status").textContent = "وجّه الكاميرا على الفاتورة"; $("status").style.color = ""; }
      } catch (e) {}
      busy = false;
    }
    await new Promise(r => setTimeout(r, 400));
  }
}

$("go").onclick = async () => {
  driver = $("driver").value.trim();
  if (!driver) { $("driver").focus(); return; }
  save();
  $("start").style.display = "none"; $("scan").style.display = "block";
  $("who").textContent = "السواق: " + driver;
  render();
  try {
    stream = await navigator.mediaDevices.getUserMedia({ video: { facingMode: "environment", width: { ideal: 1920 } }, audio: false });
    $("v").srcObject = stream; await $("v").play();
    $("status").textContent = "جاري تحميل القارئ…";
    if (!worker) worker = await Tesseract.createWorker("eng");
    $("status").textContent = "وجّه الكاميرا على الفاتورة";
    loop();
  } catch (e) { $("status").textContent = "تعذر تشغيل الكاميرا — اسمح بالوصول وافتح الصفحة عبر https"; }
};

$("change").onclick = () => { if (stream) stream.getTracks().forEach(t => t.stop()); stream = null; $("scan").style.display = "none"; $("start").style.display = "block"; };
const tsv = () => items.map((it, i) => [i + 1, it.driver, it.last4].join("\t")).join("\n");
$("copy").onclick = async () => { try { await navigator.clipboard.writeText(tsv()); $("copy").textContent = "تم النسخ ✓"; setTimeout(() => $("copy").textContent = "نسخ الجدول", 1500); } catch (e) {} };
$("csv").onclick = () => {
  const csv = "\ufeffSn,Driver,Invoice\n" + items.map((it, i) => [i + 1, it.driver, it.last4].join(",")).join("\n");
  const a = document.createElement("a"); a.href = URL.createObjectURL(new Blob([csv], { type: "text/csv" })); a.download = "invoices.csv"; a.click();
};
</script>
</body>
</html>
